version: '3.8'

services:
  mysql:
    image: mysql:8.0.34
    container_name: cla-mysql
    environment:
      MYSQL_ROOT_PASSWORD: CampusLearning2024
      MYSQL_DATABASE: learning_assistant
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7.0-alpine
    container_name: cla-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: cla-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: CampusLearning2024
    ports:
      - "9000:9000"  # API端口
      - "9001:9001"  # 控制台端口
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mysql_data:
  redis_data:
  minio_data: