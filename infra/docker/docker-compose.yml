services:
  mysql:
    image: mysql:8.0.34
    container_name: cla-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CampusLearning2024}
      MYSQL_DATABASE: ${MYSQL_DB:-learning_assistant}
      MYSQL_USER: ${MYSQL_USER:-cla_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ClaPassword2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cla-network

  redis:
    image: redis:7.0-alpine
    container_name: cla-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cla-network

  minio:
    image: minio/minio
    container_name: cla-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-CampusLearning2024}
    ports:
      - "9000:9000"  # API端口
      - "9001:9001"  # 控制台端口
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cla-network

  java-app:
    build:
      context: ../../backend/java/learning-assistant
      dockerfile: Dockerfile
    container_name: cla-java-app
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-learning_assistant}
      MYSQL_USER: ${MYSQL_USER:-cla_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ClaPassword2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EXTERNAL_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-CampusLearning2024}
      MINIO_BUCKET: ${MINIO_BUCKET:-learning-materials}
      JWT_SECRET: ${JWT_SECRET:-campus-learning-assistant-jwt-secret-key-32chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7200000}
      SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost,http://127.0.0.1
      PYTHON_API_URL: http://python-app:8000
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/login | grep -qE '200|400|401|405'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - cla-network
    restart: unless-stopped

  python-app:
    build:
      context: ../../backend/python
      dockerfile: Dockerfile
    container_name: cla-python-app
    ports:
      - "8000:8000"
    environment:
      APP_PORT: 8000
      POPPLER_PATH: /usr/bin
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.85}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cla-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cla-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      java-app:
        condition: service_healthy
      python-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cla-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  cla-network:
    driver: bridge
