spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:learning_assistant}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USER:cla_user}
spring.datasource.password=${MYSQL_PASSWORD:ClaPassword2024}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.campus.learning.entity

server.port=${SERVER_PORT:8080}

logging.level.com.campus.learning=${LOG_LEVEL:DEBUG}

# JWT
jwt.secret=${JWT_SECRET:campus-learning-assistant-jwt-secret-key-32chars}
jwt.expiration=${JWT_EXPIRATION:7200000}

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:CampusLearning2024}
minio.bucket-name=${MINIO_BUCKET:learning-materials}
